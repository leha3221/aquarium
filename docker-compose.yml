services:
  postgres:
    image: postgres:16-alpine
    container_name: aquarium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aquarium_service
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aquarium-postgres-data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d aquarium_service"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aquarium-postgres-data:
